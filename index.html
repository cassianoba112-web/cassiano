        header {
            background-color: #473694;
            color: white;
            padding: 20px;
            text-align: center;
        }

       
        .column {
            width: 30%;
            background-color: white;
            border: 2px solid #473694;
            border-radius: 10px;
            padding: 10px;
            float: left;
            margin: 1%;
            box-sizing: border-box;
        }

      
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        
        .footer-column {
            width: 45%;
            float: left;
            margin: 2.5%;
            background-color: #333;
            color: white;
            padding: 15px;
            box-sizing: border-box;
        }

        footer a {
            color: #473694;
            text-decoration: none;
        }
    </style>
</head>
